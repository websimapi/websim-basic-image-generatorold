<html><head><base href="."><title>Basic Image Generator</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    font-family: Arial, sans-serif;
    padding: 2rem;
  }

  .container {
    max-width: 800px;
    width: 100%;
    text-align: center;
  }

  h1 {
    margin-bottom: 2rem;
    font-size: 2.5rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .input-group {
    margin-bottom: 2rem;
  }

  input {
    width: 70%;
    padding: 1rem;
    font-size: 1rem;
    border: none;
    border-radius: 5px;
    margin-right: 1rem;
    background: rgba(255,255,255,0.1);
    color: white;
  }

  button {
    padding: 1rem 2rem;
    font-size: 1rem;
    background: #4CAF50;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  .image-container {
    margin-top: 2rem;
    padding: 1rem;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .editor-controls {
    margin-top: 1rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .color-picker {
    padding: 0.5rem;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 5px;
  }

  .tolerance-slider {
    width: 200px;
    margin: 0 1rem;
  }

  canvas {
    max-width: 100%;
    max-height: 500px;
    border-radius: 5px;
    display: none;
    cursor: crosshair;
  }

  .brush-size-slider {
    width: 150px;
  }

  .opacity-slider {
    width: 150px;
  }

  .tool-group {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .tool-button {
    padding: 0.5rem 1rem;
    background: #2196F3;
    border: none;
    border-radius: 3px;
    color: white;
    cursor: pointer;
  }

  .tool-button.active {
    background: #1976D2;
    box-shadow: 0 0 5px rgba(255,255,255,0.3);
  }

  .generated-image {
    max-width: 100%;
    max-height: 500px;
    border-radius: 5px;
  }

  .loading {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #4CAF50;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .placeholder-text {
    color: rgba(255,255,255,0.6);
    font-size: 1.2rem;
  }

  canvas.magic-wand {
    cursor: crosshair;
  }

  .selection-overlay {
    position: absolute;
    pointer-events: none;
    border: 1px dashed white;
  }

  .overlay-canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>AI Image Generator</h1>
    <div class="input-group">
      <input type="text" id="promptInput" placeholder="Enter your image prompt here...">
      <button onclick="generateImage()">Generate</button>
      <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" style="display:none">
      <button onclick="document.getElementById(&apos;imageUpload&apos;).click()">Upload Image</button>
    </div>
    <div class="image-container" id="imageContainer">
      <div id="loadingSpinner" class="loading" style="display: none;"></div>
      <div id="placeholderText" class="placeholder-text">Enter a prompt to generate an image</div>
      <canvas id="editCanvas" style="display: none;"></canvas>
      <div class="editor-controls" id="editorControls" style="display: none;">
        <div class="tool-group">
          <button class="tool-button active" onclick="setTool(&apos;brush&apos;)" id="brushTool">Brush</button>
          <button class="tool-button" onclick="setTool(&apos;eraser&apos;)" id="eraserTool">Eraser</button>
          <button class="tool-button" onclick="setTool(&apos;colorPicker&apos;)" id="colorPickerTool">Color Picker</button>
          <button class="tool-button" onclick="setTool(&apos;magicWand&apos;)" id="magicWandTool">Magic Wand</button>
          <button class="tool-button" onclick="setTool(&apos;fillSelection&apos;)" id="fillSelectionTool">Fill Selection</button>
          <button class="tool-button" onclick="clearSelection()" id="clearSelectionTool">Clear Selection</button>
          <button class="tool-button" onclick="setTool(&apos;setAlpha&apos;)" id="setAlphaTool">Set Alpha</button>
          <button class="tool-button" onclick="setTool(&apos;paintBucket&apos;)" id="paintBucketTool">Paint Bucket</button>
        </div>
        <div class="tool-group">
          <input type="color" id="colorPicker" class="color-picker" value="#ffffff">
          <input type="range" id="brushSize" class="brush-size-slider" min="1" max="50" value="10">
          <span id="brushSizeLabel">10px</span>
          <input type="range" id="toleranceSlider" class="tolerance-slider" min="0" max="255" value="32">
          <span id="toleranceLabel">Tolerance: 32</span>
          <input type="range" id="selectionOpacity" class="opacity-slider" min="0" max="100" value="100">
          <span id="opacityLabel">Opacity: 100%</span>
        </div>
        <button onclick="resetImage()">Reset Image</button>
        <button onclick="saveImage()">Save Image</button>
      </div>
    </div>
  </div>

  <script>let imageCounter = 0;
let originalImageData = null;
let currentImage = null;
let isDrawing = false;
let currentTool = 'brush';
let lastX = 0;
let lastY = 0;
let selectionData = null;
let currentSelection = null;
function generateImage() {
  const promptInput = document.getElementById('promptInput');
  const imageContainer = document.getElementById('imageContainer');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const placeholderText = document.getElementById('placeholderText');
  const editorControls = document.getElementById('editorControls');
  const canvas = document.getElementById('editCanvas');
  if (!promptInput.value.trim()) {
    alert('Please enter a prompt!');
    return;
  }
  loadingSpinner.style.display = 'block';
  placeholderText.style.display = 'none';
  editorControls.style.display = 'none';
  canvas.style.display = 'none';
  const existingImages = imageContainer.querySelectorAll('img');
  existingImages.forEach(img => img.remove());
  const generatedImage = document.createElement('img');
  generatedImage.id = `generatedImage_${imageCounter++}`;
  generatedImage.className = 'generated-image';
  generatedImage.style.display = 'none';
  generatedImage.crossOrigin = 'anonymous';
  generatedImage.src = promptInput.value;
  generatedImage.alt = promptInput.value;
  imageContainer.appendChild(generatedImage);
  generatedImage.onload = function () {
    loadingSpinner.style.display = 'none';
    generatedImage.style.display = 'block';
    currentImage = generatedImage;
    setupImageEditor();
  };
  generatedImage.onerror = function () {
    loadingSpinner.style.display = 'none';
    generatedImage.style.display = 'block';
  };
}
function setupImageEditor() {
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const editorControls = document.getElementById('editorControls');
  canvas.width = currentImage.naturalWidth;
  canvas.height = currentImage.naturalHeight;
  ctx.drawImage(currentImage, 0, 0);
  originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  editorControls.style.display = 'flex';
  currentImage.style.display = 'none';
  canvas.style.display = 'block';
  setupCanvasListeners();
}
function setupCanvasListeners() {
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseout', stopDrawing);
  function startDrawing(e) {
    isDrawing = true;
    [lastX, lastY] = getMousePos(canvas, e);
    if (currentTool === 'magicWand') {
      const [x, y] = getMousePos(canvas, e);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const tolerance = parseInt(document.getElementById('toleranceSlider').value);
      currentSelection = magicWandSelect(imageData, Math.round(x), Math.round(y), tolerance);
      drawSelectionOverlay(currentSelection);
    }
  }
  function draw(e) {
    if (!isDrawing) return;
    if (currentTool === 'paintBucket') {
      const [x, y] = getMousePos(canvas, e);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const tolerance = parseInt(document.getElementById('toleranceSlider').value);
      const selection = magicWandSelect(imageData, Math.round(x), Math.round(y), tolerance);
      currentSelection = selection;
      fillSelection();
      return;
    }
    if (currentTool === 'magicWand') return;
    const [currentX, currentY] = getMousePos(canvas, e);
    const brushSize = document.getElementById('brushSize').value;
    const color = document.getElementById('colorPicker').value;
    if (currentSelection) {
      const pixelIndex = Math.floor(currentY) * canvas.width + Math.floor(currentX);
      if (!currentSelection[pixelIndex]) {
        return;
      }
    }
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = brushSize;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(currentX, currentY);
    if (currentTool === 'brush') {
      ctx.strokeStyle = color;
    } else if (currentTool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    }
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    [lastX, lastY] = [currentX, currentY];
  }
  function stopDrawing() {
    isDrawing = false;
  }
}
function magicWandSelect(imageData, startX, startY, tolerance) {
  const width = imageData.width;
  const height = imageData.height;
  const pixels = imageData.data;
  const visited = new Uint8Array(width * height);
  const selected = new Uint8Array(width * height);
  const startPos = (startY * width + startX) * 4;
  const startR = pixels[startPos];
  const startG = pixels[startPos + 1];
  const startB = pixels[startPos + 2];
  const stack = [[startX, startY]];
  while (stack.length) {
    const [x, y] = stack.pop();
    const pos = y * width + x;
    if (x < 0 || x >= width || y < 0 || y >= height || visited[pos]) {
      continue;
    }
    const pixelPos = pos * 4;
    const r = pixels[pixelPos];
    const g = pixels[pixelPos + 1];
    const b = pixels[pixelPos + 2];
    const colorDiff = Math.sqrt(Math.pow(r - startR, 2) + Math.pow(g - startG, 2) + Math.pow(b - startB, 2));
    if (colorDiff <= tolerance) {
      visited[pos] = 1;
      selected[pos] = 1;
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
  }
  return selected;
}
function drawSelectionOverlay(selected) {
  currentSelection = selected;
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const currentImageData = ctx.getImageData(0, 0, width, height);
  originalImageData = currentImageData;
  ctx.putImageData(currentImageData, 0, 0);
  const outlineCanvas = document.createElement('canvas');
  outlineCanvas.width = width;
  outlineCanvas.height = height;
  const outlineCtx = outlineCanvas.getContext('2d');
  outlineCtx.strokeStyle = 'white';
  outlineCtx.lineWidth = 1;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const pos = y * width + x;
      if (selected[pos]) {
        const isEdge = x > 0 && !selected[pos - 1] || x < width - 1 && !selected[pos + 1] || y > 0 && !selected[pos - width] || y < height - 1 && !selected[pos + width];
        if (isEdge) {
          outlineCtx.beginPath();
          outlineCtx.rect(x, y, 1, 1);
          outlineCtx.stroke();
        }
      }
    }
  }
  ctx.drawImage(outlineCanvas, 0, 0);
}
function getMousePos(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return [(e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY];
}
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`${tool}Tool`).classList.add('active');
  const canvas = document.getElementById('editCanvas');
  if (tool === 'fillSelection' && currentSelection) {
    fillSelection();
  } else if (tool === 'setAlpha' && currentSelection) {
    fillSelection();
  } else {
    canvas.className = tool === 'magicWand' ? 'magic-wand' : '';
  }
}
function resetImage() {
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  ctx.putImageData(originalImageData, 0, 0);
}
function saveImage() {
  const canvas = document.getElementById('editCanvas');
  const link = document.createElement('a');
  link.download = 'edited-image.png';
  link.href = canvas.toDataURL();
  link.click();
}
function fillSelection() {
  if (!currentSelection) return;
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const imageData = ctx.getImageData(0, 0, width, height);
  const pixels = imageData.data;
  const opacity = document.getElementById('selectionOpacity').value / 100;
  if (currentTool === 'setAlpha') {
    for (let i = 0; i < currentSelection.length; i++) {
      if (currentSelection[i]) {
        const pixelPos = i * 4;
        pixels[pixelPos + 3] = 0;
      }
    }
  } else {
    const color = document.getElementById('colorPicker').value;
    const r = parseInt(color.substr(1, 2), 16);
    const g = parseInt(color.substr(3, 2), 16);
    const b = parseInt(color.substr(5, 2), 16);
    for (let i = 0; i < currentSelection.length; i++) {
      if (currentSelection[i]) {
        const pixelPos = i * 4;
        pixels[pixelPos] = r;
        pixels[pixelPos + 1] = g;
        pixels[pixelPos + 2] = b;
        pixels[pixelPos + 3] = Math.round(255 * opacity);
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
  originalImageData = ctx.getImageData(0, 0, width, height);
}
function clearSelection() {
  currentSelection = null;
  resetImage();
}
function handleImageUpload(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const uploadedImage = document.createElement('img');
      uploadedImage.id = `generatedImage_${imageCounter++}`;
      uploadedImage.className = 'generated-image';
      uploadedImage.style.display = 'none';
      uploadedImage.crossOrigin = 'anonymous';
      uploadedImage.src = e.target.result;
      uploadedImage.alt = file.name;
      const imageContainer = document.getElementById('imageContainer');
      const existingImages = imageContainer.querySelectorAll('img');
      existingImages.forEach(img => img.remove());
      imageContainer.appendChild(uploadedImage);
      uploadedImage.onload = function () {
        currentImage = uploadedImage;
        setupImageEditor();
      };
    };
    reader.readAsDataURL(file);
  }
}
document.getElementById('brushSize').addEventListener('input', function (e) {
  document.getElementById('brushSizeLabel').textContent = `${e.target.value}px`;
});
document.getElementById('promptInput').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') {
    generateImage();
  }
});
document.getElementById('toleranceSlider').addEventListener('input', function (e) {
  document.getElementById('toleranceLabel').textContent = `Tolerance: ${e.target.value}`;
  if (selectionData && currentTool === 'magicWand') {
    drawSelectionOverlay(selectionData);
  }
});
document.getElementById('selectionOpacity').addEventListener('input', function (e) {
  document.getElementById('opacityLabel').textContent = `Opacity: ${e.target.value}%`;
  if (currentSelection && currentTool === 'fillSelection') {
    fillSelection();
  }
});
document.getElementById('imageUpload').addEventListener('change', handleImageUpload);</script>
