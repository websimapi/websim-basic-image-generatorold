<html><head><base href="." /><title>Basic Image Generator</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    font-family: Arial, sans-serif;
    padding: 2rem;
  }

  .container {
    max-width: 800px;
    width: 100%;
    text-align: center;
  }

  h1 {
    margin-bottom: 2rem;
    font-size: 2.5rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .input-group {
    margin-bottom: 2rem;
  }

  input {
    width: 70%;
    padding: 1rem;
    font-size: 1rem;
    border: none;
    border-radius: 5px;
    margin-right: 1rem;
    background: rgba(255,255,255,0.1);
    color: white;
  }

  button {
    padding: 1rem 2rem;
    font-size: 1rem;
    background: #4CAF50;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  .image-container {
    margin-top: 2rem;
    padding: 1rem;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .editor-controls {
    margin-top: 1rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .color-picker {
    padding: 0.5rem;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 5px;
  }

  .tolerance-slider {
    width: 200px;
    margin: 0 1rem;
  }

  canvas {
    max-width: 100%;
    max-height: 500px;
    border-radius: 5px;
    display: none;
    cursor: crosshair;
  }

  .brush-size-slider {
    width: 150px;
  }

  .tool-group {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .tool-button {
    padding: 0.5rem 1rem;
    background: #2196F3;
    border: none;
    border-radius: 3px;
    color: white;
    cursor: pointer;
  }

  .tool-button.active {
    background: #1976D2;
    box-shadow: 0 0 5px rgba(255,255,255,0.3);
  }

  .generated-image {
    max-width: 100%;
    max-height: 500px;
    border-radius: 5px;
  }

  .loading {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #4CAF50;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .placeholder-text {
    color: rgba(255,255,255,0.6);
    font-size: 1.2rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>AI Image Generator</h1>
    <div class="input-group">
      <input type="text" id="promptInput" placeholder="Enter your image prompt here...">
      <button onclick="generateImage()">Generate</button>
    </div>
    <div class="image-container" id="imageContainer">
      <div id="loadingSpinner" class="loading" style="display: none;"></div>
      <div id="placeholderText" class="placeholder-text">Enter a prompt to generate an image</div>
      <canvas id="editCanvas" style="display: none;"></canvas>
      <div class="editor-controls" id="editorControls" style="display: none;">
        <div class="tool-group">
          <button class="tool-button active" onclick="setTool('brush')" id="brushTool">Brush</button>
          <button class="tool-button" onclick="setTool('eraser')" id="eraserTool">Eraser</button>
          <button class="tool-button" onclick="setTool('colorPicker')" id="colorPickerTool">Color Picker</button>
        </div>
        <div class="tool-group">
          <input type="color" id="colorPicker" class="color-picker" value="#ffffff">
          <input type="range" id="brushSize" class="brush-size-slider" min="1" max="50" value="10">
          <span id="brushSizeLabel">10px</span>
        </div>
        <button onclick="resetImage()">Reset Image</button>
        <button onclick="saveImage()">Save Image</button>
      </div>
    </div>
  </div>

  <script>
    let imageCounter = 0;
    let originalImageData = null;
    let currentImage = null;
    let isDrawing = false;
    let currentTool = 'brush';
    let lastX = 0;
    let lastY = 0;

    function generateImage() {
      const promptInput = document.getElementById('promptInput');
      const imageContainer = document.getElementById('imageContainer');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const placeholderText = document.getElementById('placeholderText');
      const editorControls = document.getElementById('editorControls');
      const canvas = document.getElementById('editCanvas');
      
      if (!promptInput.value.trim()) {
        alert('Please enter a prompt!');
        return;
      }

      loadingSpinner.style.display = 'block';
      placeholderText.style.display = 'none';
      editorControls.style.display = 'none';
      canvas.style.display = 'none';

      const existingImages = imageContainer.querySelectorAll('img');
      existingImages.forEach(img => img.remove());

      const generatedImage = document.createElement('img');
      generatedImage.id = `generatedImage_${imageCounter++}`;
      generatedImage.className = 'generated-image';
      generatedImage.style.display = 'none';
      generatedImage.crossOrigin = 'anonymous';

      generatedImage.src = promptInput.value;
      generatedImage.alt = promptInput.value;

      imageContainer.appendChild(generatedImage);

      generatedImage.onload = function() {
        loadingSpinner.style.display = 'none';
        generatedImage.style.display = 'block';
        currentImage = generatedImage;
        setupImageEditor();
      };

      generatedImage.onerror = function() {
        loadingSpinner.style.display = 'none';
        generatedImage.style.display = 'block';
      };
    }

    function setupImageEditor() {
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      const editorControls = document.getElementById('editorControls');

      canvas.width = currentImage.naturalWidth;
      canvas.height = currentImage.naturalHeight;

      ctx.drawImage(currentImage, 0, 0);
      originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      editorControls.style.display = 'flex';
      currentImage.style.display = 'none';
      canvas.style.display = 'block';

      setupCanvasListeners();
    }

    function setupCanvasListeners() {
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);

      function startDrawing(e) {
        isDrawing = true;
        [lastX, lastY] = getMousePos(canvas, e);
      }

      function draw(e) {
        if (!isDrawing) return;

        const [currentX, currentY] = getMousePos(canvas, e);
        const brushSize = document.getElementById('brushSize').value;
        const color = document.getElementById('colorPicker').value;

        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = brushSize;

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(currentX, currentY);

        if (currentTool === 'brush') {
          ctx.strokeStyle = color;
        } else if (currentTool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.strokeStyle = 'rgba(0,0,0,1)';
        }

        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';

        [lastX, lastY] = [currentX, currentY];
      }

      function stopDrawing() {
        isDrawing = false;
      }
    }

    function getMousePos(canvas, e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return [
        (e.clientX - rect.left) * scaleX,
        (e.clientY - rect.top) * scaleY
      ];
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`${tool}Tool`).classList.add('active');
    }

    function resetImage() {
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      ctx.putImageData(originalImageData, 0, 0);
    }

    function saveImage() {
      const canvas = document.getElementById('editCanvas');
      const link = document.createElement('a');
      link.download = 'edited-image.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    document.getElementById('brushSize').addEventListener('input', function(e) {
      document.getElementById('brushSizeLabel').textContent = `${e.target.value}px`;
    });

    document.getElementById('promptInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateImage();
      }
    });
  </script>

</body></html>
